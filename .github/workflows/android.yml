name: Build & Release Android TV APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore (only if the KEYSTORE_BASE64 secret is set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/samonline.jks
            echo "Release keystore found - release APK will be signed with it."
          else
            echo "No KEYSTORE_BASE64 secret - release APK will use the debug key."
          fi

      - name: Get app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug + release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SAM-Online-TV-v${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/SAM-Online-TV-v${{ steps.version.outputs.version }}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/SAM-Online-TV.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SAM-Online-TV-v${{ steps.version.outputs.version }}-build${{ github.run_number }}
          path: dist/*.apk

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}-${{ github.run_number }}"
          gh release create "$TAG" \
            "dist/SAM-Online-TV-v${VERSION}.apk" \
            "dist/SAM-Online-TV.apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "SAM Online TV v${VERSION} (Build ${{ github.run_number }})" \
            --notes "Android TV build of SAM Online TV. Install: sideload the APK on your Android TV / Google TV / TV box (needs a SAM Online BDIX connection). Test it with tools/tv-test/run_test.sh."
